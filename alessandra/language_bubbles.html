<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Bubble Chart</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            display: flex;
        }
        .chart-container {
            flex: 1;
            position: relative;
        }
        .sidebar {
            width: 300px;
            background: none;
            overflow-y: scroll;
            padding: 12px 8px 12px 8px;
            box-shadow: none;
            height: 100vh;
            scrollbar-width: thin;
            scrollbar-color: #b8aadb #f0f0f0;
        }
        .sidebar::-webkit-scrollbar {
            width: 10px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #b8aadb;
            border-radius: 6px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: #f0f0f0;
        }
        .language-item {
            cursor: pointer;
            padding: 3px 6px;
            margin: 0.5px 0;
            border-radius: 6px;
            transition: all 0.2s;
            font-weight: 600;
            text-align: center;
            background: transparent;
            line-height: 0.8;
        }
        .language-item:hover {
            background: rgba(170, 135, 251, 0.587);
            transform: translateX(-3px);
        }
        .tooltip {
            position: absolute;
            background: rgba(170, 135, 251, 0.587);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            pointer-events: none;
            font-size: 14px;
            display: none;
            z-index: 1000;
            border: 1px solid #7c75e0;
        }
        .counter {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(170, 135, 251, 0.587);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            z-index: 1000;
            border: 2px solid #7c75e0;
        }
    </style>
</head>
<body>
    <div class="chart-container">
        <div class="counter" id="counter"></div>
        <div class="tooltip" id="tooltip"></div>
    </div>
    <div class="sidebar">
        <div id="language-list"></div>
    </div>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
        fetch('./data_stats.json')
            .then(response => response.json())
            .then(json => {
                const valueCounts = json.language.value_counts;
                // Filter languages to only include those with at least 3 characters
                const data = Object.entries(valueCounts)
                    .filter(([language, frequency]) => language.length >= 3 && language[0] === language[0].toUpperCase() && /^[A-Z]/.test(language[0]))
                    .map(([language, frequency]) => ({
                        language,
                        frequency
                    }));

                const width = window.innerWidth - 300; // Subtract sidebar width
                const height = window.innerHeight;

                // Scale for bubble sizes
                const radiusScale = d3.scaleSqrt()
                    .domain([d3.min(data, d => d.frequency), d3.max(data, d => d.frequency)])
                    .range([5, Math.min(width, height) * 0.15]);

                // Prepare nodes for force simulation
                const nodes = data.map(d => ({
                    language: d.language,
                    frequency: d.frequency,
                    radius: radiusScale(d.frequency),
                    x: width / 2 + (Math.random() - 0.5) * width * 0.5,
                    y: height / 2 + (Math.random() - 0.5) * height * 0.5
                }));

                // Display the count of languages
                d3.select("#counter").text(`Total Languages: ${nodes.length}`);

                // Create SVG
                d3.select(".chart-container").selectAll("svg").remove();
                const svg = d3.select(".chart-container")
                    .append("svg")
                    .attr("width", width)
                    .attr("height", height)
                    .style("display", "block")
                    .style("position", "fixed")
                    .style("top", 0)
                    .style("left", 0);

                const g = svg.append("g");

                const palette = [
                    '#14143b',
                    '#332e58',
                    '#524a77',
                    '#736997',
                    '#9589b9',
                    '#b8aadb',
                    '#dccdff'
                ];
                const maxFreq = d3.max(data, d => d.frequency);
                const minFreq = d3.min(data, d => d.frequency);
                // Strict rank-based color mapping: darkest for largest, lightest for smallest
                const sorted = [...data].sort((a, b) => b.frequency - a.frequency);
                const colorByLanguage = {};
                if (sorted.length > 0) {
                    colorByLanguage[sorted[0].language] = palette[0]; // Largest gets darkest
                    const restPalette = palette.slice(1);
                    const restCount = sorted.length - 1;
                    for (let i = 1; i < sorted.length; i++) {
                        // Distribute only among lighter colors, never assign palette[0] again
                        const idx = restCount > 1 ? Math.floor((i - 1) * restPalette.length / restCount) : 0;
                        colorByLanguage[sorted[i].language] = restPalette[idx] || restPalette[restPalette.length - 1];
                    }
                }

                const circles = g.selectAll("circle")
                    .data(nodes)
                    .enter()
                    .append("circle")
                    .attr("r", d => d.radius)
                    .attr("fill", d => colorByLanguage[d.language])
                    .attr("stroke", "none")
                    .attr("stroke-width", 0)
                    .style("cursor", "pointer");


                // Create labels
                const labels = g.selectAll("text")
                    .data(nodes)
                    .enter()
                    .append("text")
                    .attr("text-anchor", "middle")
                    .attr("dy", ".35em")
                    .style("pointer-events", "none")
                    .style("font-weight", "bold")
                    .style("fill", d => {
                        const color = d3.color(colorByLanguage[d.language]);
                        if (!color) return '#fff';
                        const brightness = (color.r * 299 + color.g * 587 + color.b * 114) / 1000;
                        return brightness > 140 ? '#14143b' : '#fff';
                    })
                    .style("text-shadow", "1px 1px 2px rgba(0,0,0,0.8)")
                    .text(d => d.language);

                // Tooltip
                const tooltip = d3.select("#tooltip");

                circles
                    .on("mouseenter", (event, d) => {
                        tooltip
                            .style("display", "block")
                            .html(`<strong>${d.language}</strong><br/>Frequency: ${d.frequency.toLocaleString()}<br/><em>Click to view details</em>`);
                    })
                    .on("mousemove", (event) => {
                        tooltip
                            .style("left", (event.pageX + 10) + "px")
                            .style("top", (event.pageY + 10) + "px");
                    })
                    .on("mouseleave", () => {
                        tooltip.style("display", "none");
                    })
                    .on("click", (event, d) => {
                        // Encode the language name for URL
                        const encodedLanguage = encodeURIComponent(d.language);
                        // Navigate to the language-specific page
                        // Adjust the path as needed for your project structure
                        window.location.href = `./language_over_time.html?language=${encodedLanguage}`;
                    });

                // Force simulation for non-overlapping bubbles
                const simulation = d3.forceSimulation(nodes)
                    .force("charge", d3.forceManyBody().strength(5))
                    .force("collide", d3.forceCollide().radius(d => d.radius + 5).iterations(2))
                    .force("center", d3.forceCenter(width / 2, height / 2))
                    .force("x", d3.forceX(width / 2).strength(0.05))
                    .force("y", d3.forceY(height / 2).strength(0.05))
                    .on("tick", ticked);

                // Run simulation to completion immediately
                simulation.tick(300);
                simulation.stop();

                function ticked() {
                    circles
                        .attr("cx", d => d.x)
                        .attr("cy", d => d.y);

                    labels
                        .attr("x", d => d.x)
                        .attr("y", d => d.y);

                    updateLabelVisibility(1);
                }
                
                // Initial render
                ticked();

                // Function to update label visibility based on zoom and size
                function updateLabelVisibility(scale) {
                    labels.style("display", d => {
                        const scaledRadius = d.radius * scale;
                        // Show label if scaled radius is large enough
                        return scaledRadius > 25 ? "block" : "none";
                    })
                    .style("font-size", d => {
                        const scaledRadius = d.radius * scale;
                        return Math.max(10, Math.min(scaledRadius * 0.35, 40)) + "px";
                    });
                }

                // Zoom behavior
                const zoom = d3.zoom()
                    .scaleExtent([0.3, 8])
                    .on("zoom", (event) => {
                        g.attr("transform", event.transform);
                        updateLabelVisibility(event.transform.k);
                    });

                svg.call(zoom);

                // Initial label visibility
                updateLabelVisibility(1);

                // Create sidebar language list - alphabetically sorted
                const sortedData = [...data].sort((a, b) => a.language.localeCompare(b.language));
                // Make smaller languages much smaller in sidebar
                const fontScale = d3.scaleLog()
                    .domain([minFreq, maxFreq])
                    .range([8, 38]);

                const languageList = d3.select("#language-list");
                
                sortedData.forEach(d => {
                    const item = languageList.append("div")
                        .attr("class", "language-item")
                        .style("font-size", fontScale(d.frequency) + "px")
                        .style("color", colorByLanguage[d.language])
                        .text(d.language)
                        .on("click", () => {
                            const encodedLanguage = encodeURIComponent(d.language);
                            window.location.href = `./language_over_time.html?language=${encodedLanguage}`;
                        });
                });
            })
            .catch(error => {
                console.error('Error loading or parsing data_stats.json:', error);
                document.body.innerHTML = '<div style="padding: 20px; color: red;">Error loading data. Please check the console.</div>';
            });
    </script>
</body>
</html>
