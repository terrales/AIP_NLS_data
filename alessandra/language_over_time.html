<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Details</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #ffffff;
    }
    .container-vertical {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    .top-section {
      width: 100%;
      padding: 16px 40px 0px 40px;
      box-sizing: border-box;
    }
    /* NEW: Compacted Header Styles */
    .header-compact {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    .header-info {
        display: flex;
        flex-direction: column;
        line-height: 1.2;
        /* CHANGE 1: Center the header text */
        text-align: center;
    }
    h1 {
      color: #333;
      /* CHANGE 2: Reduced top/bottom margin */
      margin: 0;
      font-size: 20px;
    }
    .subtitle {
      color: #666;
      margin: 0 0 36px 0; /* Add more space below subtitle */
      font-size: 13px;
    }
    .chart-legend-wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
      /* CHANGE 4: Increased spacing between header block and chart */
      margin-bottom: 15px; 
    }
    .chart-legend-row {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      width: 100%;
      gap: 20px;
    }
    #chart {
      flex: 1;
      min-width: 0;
      height: 300px; /* Reduced from 380px to 300px */
      position: relative;
    }
    .legend {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 12px;
      background: #f9f9f9;
      border-radius: 4px;
      min-width: 140px;
      flex-shrink: 0;
      font-size: 12px;
      height: fit-content;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    .legend-item:last-child {
      margin-bottom: 0;
    }
    .legend-line {
      display: inline-block;
      width: 30px;
      height: 3px;
      margin-right: 8px;
    }
    .legend-line.bold {
      height: 4px;
    }
    .bottom-section {
      width: 100%;
      padding: 0px 40px 16px 40px;
      box-sizing: border-box;
    }
    .bottom-charts {
      display: flex;
      flex-direction: row;
      gap: 24px;
      justify-content: stretch;
      align-items: stretch;
  margin-top: 0px;
  margin-bottom: 24px;
      position: relative;
      width: 100%;
    }
    .viz-container {
      min-width: 0;
      padding: 0;
      margin-bottom: 0;
    }
    .viz-container.treemap {
      display: flex;
      flex-direction: row;
      align-items: stretch;
    flex: 2.5 1 0;
      min-width: 400px;
      max-width: none;
      width: 100%;
    }
    .viz-container.sunburst {
      flex: 2 1 0;
      min-width: 400px;
      max-width: none;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
    }
    #sunburst-viz {
      width: 100%;
      min-height: 340px;
      height: 450px; 
      max-height: none;
      display: flex; 
      align-items: flex-start; 
      flex-direction: column; 
      justify-content: flex-start; 
      overflow: visible; 
    }
    .sunburst-header-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    @media (max-width: 900px) {
      .viz-container.sunburst, #sunburst-viz {
      min-width: 0;
      height: 400px;
      min-height:340px;
      }
    }

    .treemap-other-list {
      height: 370px;
      overflow-y: auto;
      font-size: 12px;
      padding: 12px 10px 12px 16px;
      margin: 0 0 0 8px;
      line-height: 1.5;
    min-width: 160px;
    max-width: 270px;
      color: #14143b;
      background: #ffffff;
      border-radius: 6px;
      border: 1.5px solid #e0e0e0;
      box-shadow: 0 2px 8px rgba(62, 44, 80, 0.07);
      display: none;
      position: static;
      align-self: stretch;
    }
    .treemap-other-list.active {
      display: block;
    }
    
    .back-button {
      display: inline-block;
      padding: 8px 16px;
      background: #302e67;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      cursor: pointer;
      border: none;
      font-size: 13px;
    }
    .back-button:hover {
      background: #3e3b7f;
    }
    .treemap-title, .sunburst-title {
      font-weight: bold;
      margin-bottom: 10px;
      margin-top: 0;
      display: block;
      font-size: 16px;
      color: #333;
    }
    .selection-info {
      margin-top: 0px; 
      margin-bottom: 15px; 
      padding: 10px 15px;
      background: #e8f4f8;
      border-radius: 4px;
      border-left: 4px solid #302e67;
    }
    .selection-info h3 {
      margin-top: 0;
      color: #302e67;
      font-size: 16px;
    }
    .selection-info p {
        margin: 0;
        font-size: 13px;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }
    .instruction {
      display: none; 
    }
    .reset-button {
      padding: 8px 16px;
      background: #6c757d;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-left: 10px;
    }
    .reset-button:hover {
      background: #5a6268;
    }
    .treemap-cell {
      stroke: #fff;
      stroke-width: 2px;
      cursor: pointer;
    }
    .treemap-text {
      pointer-events: none;
      fill: white;
      font-size: 12px;
      font-weight: 500;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .sunburst-arc {
  cursor: pointer;
  stroke: none;
  stroke-width: 0;
    }
    .sunburst-arc:hover {
      opacity: 0.8;
    }
    .sunburst-text {
      pointer-events: none;
      fill: white;
      font-size: 11px;
      font-weight: 500;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .breadcrumb {
      font-size: 14px;
      color: #666;
      margin-bottom: 10px;
      min-height: 20px;
    }
    .breadcrumb-item {
      color: #302e67;
      cursor: pointer;
    }
    .breadcrumb-item:hover {
      text-decoration: underline;
    }
    /* STYLES for compact sample view */
    .books-sample {
      margin-top: 0px;
      padding: 15px;
      background: #fff9f0;
      border-radius: 4px;
      border-left: 4px solid #ffa600;
      display: flex; 
      flex-direction: row;
      flex-wrap: wrap; 
      gap: 15px; 
      justify-content: flex-start;
    }
    .books-sample h4 {
      margin-top: 20px;
      margin-bottom: 12px;
      color: #ffa600;
      font-size: 16px;
      width: 100%;
    }
    .book-item {
      width: 200px; 
      height: 200px; 
      padding: 10px;
      background: white;
      border-radius: 4px;
      border-left: none;
      box-shadow: 0 1px 6px rgba(0,0,0,0.15); 
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .book-item:last-child {
      margin-bottom: 0;
    }
    .book-title {
      font-weight: 700;
      color: #333;
      margin-bottom: 6px;
      font-size: 14px;
      flex-grow: 1; 
      line-height: 1.3;
      overflow: visible; 
      cursor: pointer; 
    }
    .book-meta {
      font-size: 12px;
      color: #666;
      margin-bottom: 2px;
      overflow: visible; 
      white-space: normal;
      text-overflow: clip;
    }
    .book-meta strong {
      color: #444;
    }
    .book-flair-wrapper {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #eee;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: flex-start;
      flex-shrink: 0;
    }
    .book-flair {
      font-size: 10px;
      font-weight: bold;
      padding: 3px 6px;
      border-radius: 12px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .flair-year {
        background-color: #ffe0b2;
        color: #e65100;
    }
    .flair-type {
        background-color: #c8e6c9;
        color: #2e7d32;
    }
    .flair-subject {
        background-color: #bbdefb;
        color: #1565c0;
    }
  </style>
</head>
<body>

  <div class="container-vertical">
    <div class="top-section">
      <div class="header-compact">
          <a class="back-button" href="./language_bubbles.html">← Back to Overview</a>
          <div class="header-info">
              <h1 id="language-name">Language Popularity Over Time</h1>
              <p class="subtitle" id="stats-subtitle">Time Series Analysis</p>
          </div>
          <div>
            <button class="reset-button" id="reset-button" style="display: none;">Clear Selection</button>
          </div>
      </div>
      <div class="instruction" id="interactive-banner"></div>
      <div class="chart-legend-wrapper">
        <div class="chart-legend-row">
          <div id="chart">
            <div class="loading">Loading data...</div>
          </div>
          <div class="legend" id="legend"></div>
        </div>
      </div>
    </div>
    <div class="bottom-section">
      <div id="selection-info" style="display: none;"></div>
      <div class="bottom-charts">
        <div class="viz-container treemap">
          <div id="treemap-viz" style="position:relative;"></div>
          <div id="treemap-other-list" class="treemap-other-list"></div>
        </div>
        <div class="viz-container sunburst">
          <div id="sunburst-viz"></div>
        </div>
      </div>
      <div id="books-sample" class="books-sample" style="display: none; margin-top: 15px;"></div>
    </div>
  </div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>

  const urlParams = new URLSearchParams(window.location.search);
  const selectedLanguage = urlParams.get('language');

  let timeSeriesData = null;
  let currentLangSamples = null;
  let subjectTopicReference = null;

  // Palette for treemap/sunburst (darkest = largest)
  const treemapPalette = [
    '#14143b',
    '#332e58',
    '#524a77',
    '#736997',
    '#9589b9',
    '#b8aadb',
    '#dccdff'
  ];

  // Palette for line chart (current usage)
  const linePalette = [
    '#14143b',
    '#3d2d5d',
    '#694980',
    '#9866a3',
    '#ca85c6',
    '#ffa5e7',
    '#fc8fcc',
    '#f679ae',
    '#ee6490',
    '#e35071',
    '#d43d51'
  ];
  let colorByLanguage = {};

  // Load topic_hierarchy_results.json at page load
  fetch('./topic_hierarchy_results.json')
    .then(r => r.json())
    .then(data => { subjectTopicReference = data; })
    .catch(e => {
    console.warn('Could not load topic_hierarchy_results.json:', e);
    subjectTopicReference = {};
    });

  if (selectedLanguage) {
    document.getElementById('language-name').textContent =
    `${selectedLanguage} - Popularity Over Time`;
  }

  function loadSamplesForLanguage(lang) {
    const safeLangName = lang.replace(' ', '_').replace('/', '_');
    const url = `./samples_shards/samples_${safeLangName}.json`;

    if (currentLangSamples && currentLangSamples.language === lang) {
      return Promise.resolve();
    }

    console.log(`Fetching sample data for: ${lang}`);

    return fetch(url)
      .then(response => {
        if (!response.ok) {
          console.warn(`Sample shard not found for ${lang} at ${url}. Treating samples as empty.`);
          return {};
        }
        return response.json();
      })
      .then(data => {
        currentLangSamples = { language: lang, data: data };
      })
      .catch(error => {
        console.error(`Error loading sample shard for ${lang}:`, error);
        currentLangSamples = { language: lang, data: {} };
      });
  }

    Promise.all([
      fetch('./language_timeseries_detailed.json')
        .then(r => r.json())
        .then(data => { 
            if (data && data.series) {
                data.series = data.series.map(series => {
                    series.values = series.values.map(v => ({
                        ...v,
                        count: isNaN(v.count) ? 0 : Number(v.count)
                    }));
                    return series;
                });
            }
            return data;
        })
        .catch(e => { console.error('❌ FAILED TO LOAD/PARSE frequency data:', e); throw new Error('Frequency Data Load Failure'); }),
        
      fetch('./historical_events.json')
        .then(r => r.json())
        .catch(e => { console.warn('Historical events file not found or malformed.'); return []; })

    ]).then(([frequencyData, events]) => {
      
      timeSeriesData = frequencyData; 

      document.getElementById('chart').innerHTML = '';

      if (!timeSeriesData || !timeSeriesData.series || timeSeriesData.series.length === 0) {
        document.getElementById('chart').innerHTML =
          '<p style="color: red; padding: 20px;">No time-series data available after loading. Check console for file errors.</p>';
        return; 
      }
      
      const langTotals = timeSeriesData.series.map(d => ({
        language: d.language,
        total: d3.sum(d.values, v => v.count)
      }));
      const sortedLangs = langTotals.sort((a, b) => b.total - a.total);
      colorByLanguage = {};
      if (sortedLangs.length > 0) {
        colorByLanguage[sortedLangs[0].language] = linePalette[0];
        const restPalette = linePalette.slice(1);
        const restCount = sortedLangs.length - 1;
        for (let i = 1; i < sortedLangs.length; i++) {
          const idx = restCount > 1 ? Math.floor((i - 1) * restPalette.length / restCount) : 0;
          colorByLanguage[sortedLangs[i].language] = restPalette[idx] || restPalette[restPalette.length - 1];
        }
      }

      createLineChart(timeSeriesData, selectedLanguage, events);
      const years = timeSeriesData.years;
      showYearRangeStats(d3.min(years), d3.max(years), selectedLanguage);
      
      loadSamplesForLanguage(selectedLanguage).then(displayBooksSample);

    }).catch(error => {
      console.error("CRITICAL LOADING FAILURE:", error.message, error);
      document.getElementById('chart').innerHTML =
        '<p style="color: red; padding: 20px;">Error loading data. See console for CRITICAL FAILURE details.</p>';
    });

    function createLineChart(data, selectedLanguage, events) {
      const chartDiv = document.getElementById('chart');
      const chartWidth = chartDiv.clientWidth;
      const margin = {top: 20, right: 20, bottom: 80, left: 60};
      const width = chartWidth - margin.left - margin.right;
      const height = 320 - margin.top - margin.bottom;

      const svg = d3.select("#chart")
        .append("svg")
        .attr("width", width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      const x = d3.scaleLinear()
        .domain(d3.extent(data.years))
        .range([0, width]);

      const selectedSeries = data.series.find(d => d.language === selectedLanguage);
      const selectedMax = selectedSeries ? d3.max(selectedSeries.values, v => v.count) : 1;
      let similarSeries = data.series
        .filter(d => d.language !== selectedLanguage)
        .map(d => ({
          ...d,
          max: d3.max(d.values, v => v.count),
          diff: Math.abs((d3.max(d.values, v => v.count) || 1) - selectedMax)
        }))
        .sort((a, b) => a.diff - b.diff);
      let filtered = similarSeries.filter(d => d.max >= selectedMax / 10 && d.max <= selectedMax * 10);
      if (filtered.length < 5) {
        filtered = similarSeries.slice(0, Math.max(5, Math.min(10, similarSeries.length)));
      } else {
        filtered = filtered.slice(0, 10);
      }
      similarSeries = filtered.map(({max, diff, ...rest}) => rest);
  const bgPalette = linePalette.slice(1);
      const bgColorByLanguage = {};
      similarSeries.forEach((d, i) => {
        bgColorByLanguage[d.language] = bgPalette[i % bgPalette.length];
      });
      const y = d3.scaleLinear().domain([0, Math.max(2, selectedMax)]).range([height, 0]);

      svg.append("g")
        .attr("transform", `translate(0,${height})`)
        .call(d3.axisBottom(x).tickFormat(d3.format("d")))
        .append("text")
        .attr("x", width / 2)
        .attr("y", 40)
        .attr("fill", "black")
        .style("font-size", "14px")
        .text("Year");

      svg.append("g")
        .call(d3.axisLeft(y))
        .append("text")
        .attr("transform", "rotate(-90)")
        .attr("y", -50)
        .attr("x", -height / 2)
        .attr("fill", "black")
        .style("font-size", "14px")
        .text("Publication Count");

      const line = d3.line()
        .x(d => x(d.year))
        .y(d => y(d.count))
        .defined(d => d.count > 0);

      similarSeries.forEach(languageData => {
        svg.append("path")
          .datum(languageData.values)
          .attr("fill", "none")
          .attr("stroke", bgColorByLanguage[languageData.language])
          .attr("stroke-width", 2)
          .attr("stroke-opacity", 0.18)
          .attr("d", line);
      });

      if (selectedSeries) {
        svg.append("path")
          .datum(selectedSeries.values)
          .attr("fill", "none")
          .attr("stroke", linePalette[0])
          .attr("stroke-width", 3)
          .attr("stroke-opacity", 1)
          .attr("d", line);
      }

      if (Array.isArray(events) && events.length > 0) {
        const displayedLangs = [selectedLanguage, ...similarSeries.map(d => d.language)];
        const relevantEvents = events.filter(ev => {
          if (!ev.languages || !Array.isArray(ev.languages)) return false;
          return ev.languages.some(l => displayedLangs.includes(l));
        });
        // Sort events by year for better staggering
        relevantEvents.sort((a, b) => a.year - b.year);
        // Track last used x positions to avoid overlap
        const labelSlots = [];
        const slotHeight = 36; // px vertical offset per slot
        relevantEvents.forEach((ev, i) => {
          if (typeof ev.year !== 'number' || !ev.label) return;
          if (ev.year < d3.min(data.years) || ev.year > d3.max(data.years)) return;
          const xPos = x(ev.year);
          // Find a free slot (no overlap with previous labels)
          let slot = 0;
          while (labelSlots.some(s => Math.abs(s.x - xPos) < 110 && s.slot === slot)) {
            slot++;
          }
          labelSlots.push({x: xPos, slot});
          svg.append("line")
            .attr("x1", xPos)
            .attr("x2", xPos)
            .attr("y1", 0)
            .attr("y2", height)
            .attr("stroke", "#ff9800")
            .attr("stroke-width", 2)
            .attr("stroke-dasharray", "4,2");
          svg.append("foreignObject")
            .attr("x", xPos - 60)
            .attr("y", -margin.top + 2 + slot * slotHeight)
            .attr("width", 120)
            .attr("height", 32)
            .append("xhtml:div")
            .style("text-align", "center")
            .style("font-size", "13px")
            .style("background", "#fffbe6")
            .style("border", "1px solid #ffe082")
            .style("border-radius", "4px")
            .style("padding", "2px 4px")
            .style("box-shadow", "0 1px 4px rgba(255,152,0,0.08)")
            .style("cursor", "pointer")
            .on("click", () => { if (ev.url) window.open(ev.url, '_blank'); })
            .html(`<span title="${ev.label}">${ev.label.length > 28 ? ev.label.slice(0,25) + '…' : ev.label}</span>`);
        });
      }

      const brush = d3.brushX()
        .extent([[0, 0], [width, height]])
        .on("end", brushed);

      svg.append("g").attr("class", "brush").call(brush);

      function brushed(event) {
        const selection = event.selection;
        if (!selection) {
          document.getElementById('reset-button').style.display = 'none';
          const years = data.years;
          selectedFilters.startYear = d3.min(years);
          selectedFilters.endYear = d3.max(years);
          selectedFilters.type = null;
          selectedFilters.subject = null;
          showYearRangeStats(d3.min(years), d3.max(years), selectedLanguage);
          loadSamplesForLanguage(selectedLanguage).then(displayBooksSample);
          return;
        }
        const [x0, x1] = selection.map(x.invert);
        const startYear = Math.round(x0);
        const endYear = Math.round(x1);
        selectedFilters.startYear = startYear;
        selectedFilters.endYear = endYear;
        selectedFilters.type = null;
        selectedFilters.subject = null;
        showYearRangeStats(startYear, endYear, selectedLanguage);
        loadSamplesForLanguage(selectedLanguage).then(displayBooksSample);
        document.getElementById('reset-button').style.display = 'inline-block';
      }

      const legend = d3.select("#legend");
      const legendLangs = [selectedSeries, ...similarSeries].filter(Boolean);
      legend.selectAll("*").remove();
      legendLangs.forEach(languageData => {
        const isSelected = languageData.language === selectedLanguage;
        const color = isSelected ? linePalette[0] : bgColorByLanguage[languageData.language];
        const item = legend.append("div").attr("class", "legend-item");
        item.append("span")
          .attr("class", isSelected ? "legend-line bold" : "legend-line")
          .style("background-color", color)
          .style("opacity", isSelected ? 1 : 0.6);
        item.append("span")
          .style("font-weight", isSelected ? "bold" : "normal")
          .style("color", isSelected ? color : "#333")
          .text(languageData.language);
      });
    }

    let lastTypeCounts = null, lastTotalCount = null;
    let selectedFilters = {
      startYear: null,
      endYear: null,
      type: null,
      subject: null
    };
    
    // --- UPDATED displayBooksSample FUNCTION (Max Title Length Increased) ---
    const MAX_TITLE_LENGTH = 100; // CHANGE 8: Increased from 70 to 100
    
    function displayBooksSample() { 
      const container = d3.select("#books-sample");
      container.html('');
      
      if (!currentLangSamples || currentLangSamples.language !== selectedLanguage || !currentLangSamples.data) {
          container.style('display', 'none');
          return; 
      }
      
      const langSamples = currentLangSamples.data;
      
      let candidates = [];
      
      const currentTypeFilter = selectedFilters.type;
      const currentSubjectFilter = selectedFilters.subject;
      
      for (let year = selectedFilters.startYear; year <= selectedFilters.endYear; year++) {
        const yearSamples = langSamples[year]; 

        if (yearSamples) {
          let samplesToAdd = [];
          
          if (currentTypeFilter && currentSubjectFilter) {
            samplesToAdd = yearSamples.type && yearSamples.type[currentTypeFilter] || [];

          } else if (currentTypeFilter) {
            samplesToAdd = yearSamples.type && yearSamples.type[currentTypeFilter] || [];

          } else if (currentSubjectFilter) {
            samplesToAdd = yearSamples.subject && yearSamples.subject[currentSubjectFilter] || [];
            
          } else {
            samplesToAdd = yearSamples.year || [];
          }
          
          samplesToAdd.forEach(book => {
            const isDuplicate = candidates.some(c => c.title === book.title && c.creator === book.creator && c.year === year);
            if (!isDuplicate) {
                candidates.push({
                    ...book,
                    year: year,
                    type: currentTypeFilter || book.type, 
                    subject: currentSubjectFilter || book.subject
                });
            }
          });
        }
      }
      
      // Secondary filter
      if (currentTypeFilter && currentSubjectFilter) {
        
        let softIntersectionCandidates = candidates.filter(record => {
            const recordSubject = record.subject;

            const recordSubjectMatch = recordSubject && 
                                       (recordSubject === currentSubjectFilter || 
                                        (Array.isArray(recordSubject) && recordSubject.includes(currentSubjectFilter)) ||
                                        (typeof recordSubject === 'string' && recordSubject.includes(currentSubjectFilter)));
            
            return recordSubjectMatch;
        });

        if (softIntersectionCandidates.length > 0) {
            candidates = softIntersectionCandidates;
        }
      }
      
      // Final deduplication
      const uniqueCandidates = Array.from(new Map(candidates.map(item => [
          `${item.title}-${item.creator}-${item.year}-${item.type}-${item.subject}`, item
      ])).values());

      if (uniqueCandidates.length === 0) {
        container.style('display', 'none');
        return;
      }
      
      // Randomly sample up to 5 records
      const sampleSize = Math.min(5, uniqueCandidates.length);
      const sample = [];
      const usedIndices = new Set();
      
      while (sample.length < sampleSize && usedIndices.size < uniqueCandidates.length) {
        const idx = Math.floor(Math.random() * uniqueCandidates.length);
        if (!usedIndices.has(idx)) {
          usedIndices.add(idx);
          sample.push(uniqueCandidates[idx]);
        }
      }
      
      // Build filter description
      let filterDesc = `${selectedLanguage} publications`;
      const yearRange = (selectedFilters.startYear === selectedFilters.endYear) 
                        ? `${selectedFilters.startYear}` 
                        : `${selectedFilters.startYear}–${selectedFilters.endYear}`;

      filterDesc += ` in ${yearRange}`;
      if (currentTypeFilter) {
        filterDesc += `, type: ${currentTypeFilter}`;
      }
      if (currentSubjectFilter) {
        filterDesc += `, subject: ${currentSubjectFilter}`;
      }
      
      container.style('display', 'flex'); 
      container.append('h4').html(`📚 Sample Records: ${filterDesc}`);
      
      sample.forEach((record, i) => {
        const item = container.append('div').attr('class', 'book-item');
        
        const titleText = record.title ? record.title : `Record ${i + 1}`;
        const truncatedTitle = titleText.length > MAX_TITLE_LENGTH 
                               ? titleText.substring(0, MAX_TITLE_LENGTH) + '...' 
                               : titleText;

        // --- Content Section ---
        const content = item.append('div').attr('class', 'book-content');
        
        content.append('div')
          .attr('class', 'book-title')
          .attr('title', titleText) // Full title on hover
          .text(truncatedTitle);
          
        content.append('div')
          .attr('class', 'book-meta')
          .html(`<strong>Creator:</strong> ${record.creator ? record.creator : 'Unknown'}`);
        
        if (record.publisher) {
          content.append('div')
            .attr('class', 'book-meta')
            .html(`<strong>Publisher:</strong> ${record.publisher}`);
        }
        if (record.source) {
          content.append('div')
            .attr('class', 'book-meta')
            .html(`<strong>Source:</strong> ${record.source}`);
        }
        if (record.language) {
             content.append('div')
            .attr('class', 'book-meta')
            .html(`<strong>Original Lang:</strong> ${record.language}`);
        }
        
        // --- Flair/Tag Section ---
        const flairWrapper = item.append('div').attr('class', 'book-flair-wrapper');

        // Year Flair 
        flairWrapper.append('div')
            .attr('class', 'book-flair flair-year')
            .attr('title', `Year: ${record.year}`)
            .text(record.year);
            
        // Type Flair 
        const recordType = record.type;
        if (recordType) {
            flairWrapper.append('div')
                .attr('class', 'book-flair flair-type')
                .attr('title', `Type: ${recordType}`)
                .text(recordType.length > 10 ? recordType.substring(0, 8) + '…' : recordType);
        }

        // Subject Flair 
        const recordSubject = record.subject;
        if (recordSubject) {
            flairWrapper.append('div')
                .attr('class', 'book-flair flair-subject')
                .attr('title', `Subject: ${recordSubject}`)
                .text(recordSubject.length > 10 ? recordSubject.substring(0, 8) + '…' : recordSubject);
        }
      });
    }
    
    // --- D3 Treemap (Types) ---
    function createTreemap(typeCounts, totalCount) {
      const container = d3.select("#treemap-viz");
      container.selectAll("*").remove();
      
      if (typeCounts.size === 0) {
        container.html('<p style="padding: 15px;">No publication type data available for this selection.</p>');
        return;
      }

      const width = container.node().clientWidth || 300;
      const height = 350;

      // Group types with 5 or fewer entries under 'Other'
      const mainTypes = [];
      const otherTypes = [];
      typeCounts.forEach((count, name) => {
        if (count <= 5) {
          otherTypes.push({ name, count });
        } else {
          mainTypes.push({ name, count });
        }
      });

      // Compose children for treemap
      const children = mainTypes.map(t => ({
        name: t.name,
        rawValue: t.count,
        value: Math.max(300, Math.min(t.count, 200000))
      }));
      if (otherTypes.length > 0) {
        const otherTotal = otherTypes.reduce((sum, t) => sum + t.count, 0);
        children.push({
          name: 'Other',
          rawValue: otherTotal,
          value: Math.max(300, Math.min(otherTotal, 200000)),
          _otherNames: otherTypes.map(t => t.name)
        });
      }
      const data = {
        name: "types",
        children: children
      };

      // Treemap title with count and scrollable list for 'Other'
      let titleHtml = `Publication Types`;
      if (otherTypes.length > 0) {
        titleHtml += `<br><span style='font-size:12px;color:#666;'>${data.children.length} displayed types, ${otherTypes.length} types grouped as <b>Other</b></span>`;
      }
      container.append("div")
        .attr("class", "treemap-title")
        .html(titleHtml);

      // Render the scrollable list to the side if there are 'Other' types
      const otherListDiv = d3.select('#treemap-other-list');
      if (otherTypes.length > 0) {
        otherListDiv.classed('active', true);
        otherListDiv.html(
          `<div style='font-weight:bold; color:#302e67; margin-bottom:0px;'> Other types (<=5 records):</div>` +
          `<div style='white-space:normal; word-break:break-word;'>${otherTypes.map(t => t.name).sort().join(", ")}</div>`
        );
      } else {
        otherListDiv.classed('active', false);
        otherListDiv.html("");
      }

      const root = d3.hierarchy(data)
        .sum(d => d.value)
        .sort((a, b) => b.value - a.value);

      d3.treemap()
        .size([width, height])
        .padding(0.5)
        .round(true)(root);

      // Assign darkest color to largest type, lighter to smaller
      const sortedTypes = root.children.map(d => d.data.name);
      const treemapColors = [...treemapPalette];
      while (treemapColors.length < sortedTypes.length) treemapColors.push(treemapPalette[treemapPalette.length - 1]);
      const color = d3.scaleOrdinal()
        .domain(sortedTypes)
        .range(treemapColors);

      const svg = container
        .append("svg")
        .attr("width", width)
        .attr("height", height)
        .attr("viewBox", `0 0 ${width} ${height}`)
        .style("font", "12px sans-serif");

      const cell = svg.selectAll("g")
        .data(root.leaves())
        .join("g")
        .attr("transform", d => `translate(${d.x0},${d.y0})`);

      cell.append("rect")
        .attr("class", "treemap-cell")
        .attr("width", d => d.x1 - d.x0)
        .attr("height", d => d.y1 - d.y0)
        .attr("fill", d => color(d.data.name) || '#aaaaaa')
        .attr("fill-opacity", 0.8)
        .attr("stroke", d => d.data.name === selectedFilters.type ? "#28a745" : "#fff")
        .attr("stroke-width", d => d.data.name === selectedFilters.type ? 4 : 2)
        .on("mouseover", function() {
          d3.select(this).attr("fill-opacity", 1);
        })
        .on("mouseout", function(event, d) {
          d3.select(this).attr("fill-opacity", 0.8);
        })
        .on("click", function(event, d) {
          if (selectedFilters.type === d.data.name) {
            selectedFilters.type = null;
          } else {
            selectedFilters.type = d.data.name;
          }
          showYearRangeStats(selectedFilters.startYear, selectedFilters.endYear, selectedLanguage);
          loadSamplesForLanguage(selectedLanguage).then(displayBooksSample);
        });

      cell.append("clipPath")
        .attr("id", (d, i) => `clip-${i}`)
        .append("rect")
        .attr("width", d => d.x1 - d.x0)
        .attr("height", d => d.y1 - d.y0);

      cell.each(function(d, i) {
        const minWidth = 28, minHeight = 16;
        const w = d.x1 - d.x0, h = d.y1 - d.y0;
        const percent = totalCount > 0 ? (d.data.rawValue / totalCount * 100).toFixed(1) : 0;
        let nameToShow = d.data.name;
        if (w < 50) {
          nameToShow = nameToShow.length > 7 ? nameToShow.slice(0, 7) + '…' : nameToShow;
        } else if (w < 80) {
          nameToShow = nameToShow.length > 12 ? nameToShow.slice(0, 12) + '…' : nameToShow;
        }
        const label = `${nameToShow} (${percent}%)`;
        if (w > minWidth && h > minHeight) {
          d3.select(this)
            .append("text")
            .attr("class", "treemap-text")
            .attr("clip-path", `url(#clip-${i})`)
            .attr("x", 4)
            .attr("y", 16)
            .text(label);
        }
        let titleText = `${d.data.name}\nCount: ${d3.format(",")(d.data.rawValue)}\nPercent: ${percent}%`;
        if (d.data.name === 'Other' && d.data._otherNames) {
          titleText += `\nTypes grouped: ${d.data._otherNames.length}\n` + d.data._otherNames.join(', ');
        }
        d3.select(this)
          .append("title")
          .text(titleText);
      });
    }

    function redrawTreemapIfVisible() {
      if (lastTypeCounts && lastTotalCount !== null) {
        createTreemap(lastTypeCounts, lastTotalCount);
      }
    }
    window.addEventListener('resize', redrawTreemapIfVisible);

/*
  --- D3 Sunburst (Subjects) ---
  Now expects subjectCounts to be in the new nested format:
  {
    "topic0": {
      "topic1": {
        "topic2": {
          "subjects": [ {name, value}, ... ],
          "missing_subjects": ...,
          "total_subjects": ...,
          "percent_missing": ...
        }
      }
    }
  }
  If subjectCounts is empty, shows a message.
  Displays percent missing in the caption if available.
*/
function createSunburst(subjectCounts, totalCount) {
  const container = d3.select("#sunburst-viz");
  container.selectAll("*").remove();

  // Defensive: if subjectCounts is not an object or empty, show message
  if (!subjectCounts || typeof subjectCounts !== "object" || Object.keys(subjectCounts).length === 0) {
    container.html('<p style="padding: 15px;">No subject data or topic reference available for this selection.</p>');
    return;
  }

  // Recursively convert the nested format to d3 hierarchy format
  function convertToHierarchy(obj, nodeName = "") {
    console.log("convertToHierarchy called with:", { obj, nodeName });
    
    // If this is a leaf node (has "subjects" array), return as a node
    if (obj && typeof obj === "object" && Array.isArray(obj.subjects)) {
      console.log("Found leaf node with subjects:", obj.subjects.length);
      return {
        name: nodeName || "Root",
        children: obj.subjects.map(s => ({
          name: s.name,
          value: s.value
        })),
        missing_subjects: obj.missing_subjects,
        total_subjects: obj.total_subjects,
        percent_missing: obj.percent_missing
      };
    }
    
    // Otherwise, it's a nested object: keys are names, values are next level
    const children = [];
    for (const [key, value] of Object.entries(obj)) {
      console.log(`Processing key: ${key}`);
      // If value is a leaf node, convert it
      if (value && typeof value === "object" && Array.isArray(value.subjects)) {
        console.log(`${key} is a leaf node with ${value.subjects.length} subjects`);
        children.push({
          name: key,
          children: value.subjects.map(s => ({
            name: s.name,
            value: s.value
          })),
          missing_subjects: value.missing_subjects,
          total_subjects: value.total_subjects,
          percent_missing: value.percent_missing
        });
      } else if (value && typeof value === "object") {
        // Otherwise, recurse
        console.log(`${key} has nested structure, recursing...`);
        const child = convertToHierarchy(value, key);
        if (child && ((Array.isArray(child) && child.length > 0) || (child.children && child.children.length > 0))) {
          children.push(child);
        }
      }
    }
    
    console.log(`Returning ${children.length} children for ${nodeName || 'root'}`);
    
    // If we have a name, return as a node; otherwise return the children array
    if (nodeName) {
      return { name: nodeName, children };
    }
    return children;
  }

  // Compose d3 hierarchy data
  const children = convertToHierarchy(subjectCounts);
  console.log("Raw subjectCounts:", subjectCounts);
  console.log("Converted children:", children);
  const data = {
    name: "Subjects",
    children: children
  };
  console.log("Final data structure:", data);

  // Find percent missing (search for first node with percent_missing)
  let percentMissing = null;
  let missingSubjects = null;
  let totalSubjects = null;
  function findMissingInfo(node) {
    if (node.percent_missing !== undefined) {
      percentMissing = node.percent_missing;
      missingSubjects = node.missing_subjects;
      totalSubjects = node.total_subjects;
      return true;
    }
    if (node.children) {
      for (const child of node.children) {
        if (findMissingInfo(child)) return true;
      }
    }
    return false;
  }
  findMissingInfo(data);

  if (!data.children || data.children.length === 0) {
    container.html('<p style="padding: 15px;">No subject data available after applying filtering rules.</p>');
    return;
  }

  // FIX: Increase SVG container size and add more padding to prevent clipping.
  const width = 370;
  const height = 370;
  const radius = Math.min(width, height) / 2 - 125;

  // Sunburst title and caption block
  const sunburstHeader = container.append("div")
    .attr("class", "sunburst-header-block")
    .style("margin-bottom", "6px");
  sunburstHeader.append("div")
    .attr("class", "sunburst-title")
    .text("Publication Topics");

  // Count number of leaf nodes (subjects)
  function countLeafNodes(node) {
    if (!node.children || node.children.length === 0) return 1;
    return node.children.reduce((sum, child) => sum + countLeafNodes(child), 0);
  }
  let numLeafNodes = countLeafNodes(data);
  let captionText = `${numLeafNodes} different subjects. Click segments to zoom in. Click leaf nodes to filter by subject.`;
  if (percentMissing !== null && totalSubjects !== null && missingSubjects !== null) {
    captionText += ` <span style="color:#b00;font-size:11px;">${percentMissing.toFixed(1)}% subjects missing</span>`;
  }
  sunburstHeader.append("div")
    .html(captionText)
    .attr("class", "sunburst-caption")
    .style("font-size", "12px")
    .style("color", "#666")
    .style("margin-bottom", "8px");

  // D3 hierarchy and partition
  const root = d3.hierarchy(data)
    .sum(d => d.value)
    .sort((a, b) => b.value - a.value);

  d3.partition()
    .size([2 * Math.PI, root.height + 1])
    (root);

  root.each(d => d.current = d);

  // Assign darkest color to largest top-level topic (same as treemap)
  // Recursively sum all leaf values for each top-level topic
  function sumAllLeaves(node) {
    if (!node.children || node.children.length === 0) {
      return node.value || 0;
    }
    return node.children.reduce((acc, child) => acc + sumAllLeaves(child), 0);
  }
  const sortedTopics = data.children
    .map(d => ({ name: d.name, value: sumAllLeaves(d) }))
    .sort((a, b) => b.value - a.value);
  let sunburstColors = treemapPalette.slice();
  while (sunburstColors.length < sortedTopics.length) sunburstColors.push(treemapPalette[treemapPalette.length - 1]);
  const colorScale = d3.scaleOrdinal()
    .domain(sortedTopics.map(d => d.name))
    .range(sunburstColors);
  const colorByTopic0 = {};
  sortedTopics.forEach(t => { colorByTopic0[t.name] = colorScale(t.name); });

  // Arc generator (smaller empty center)
  const arc = d3.arc()
    .startAngle(d => d.x0)
    .endAngle(d => d.x1)
    .padAngle(d => Math.min((d.x1 - d.x0) / 2, 0.005))
    .padRadius(radius * 1.5)
    .innerRadius(d => d.y0 === 0 ? 0.05 * radius : d.y0 * radius)
    .outerRadius(d => Math.max(d.y0 * radius, d.y1 * radius - 1));

  // SVG container
  const svg = container
    .append("svg")
    .attr("width", width)
    .attr("height", height)
    .attr("viewBox", [-(width / 2), -(height / 2), width, height])
    .style("font", "11px sans-serif")
    .style("display", "block")
    .style("margin", "0 auto");

  // Breadcrumb
  const breadcrumb = container.insert("div", "svg")
    .attr("class", "breadcrumb")

  // Mark that the sunburst has drawn at least once
  window._sunburstHasDrawn = true;

  // Arcs
  const path = svg.append("g")
    .selectAll("path")
    .data(root.descendants().slice(1))
    .join("path")
    .attr("class", "sunburst-arc")
    .attr("fill", d => {
      let t0 = d;
      while (t0.depth > 1) t0 = t0.parent;
      return colorByTopic0[t0.data.name] || sunburstPalette[0];
    })
    .attr("fill-opacity", d => arcVisible(d.current) ? (d.children ? 0.7 : 0.45) : 0)
    .attr("pointer-events", d => arcVisible(d.current) ? "auto" : "none")
    .attr("stroke", d => d.data.name === selectedFilters.subject ? "#28a745" : "none")
    .attr("stroke-width", d => d.data.name === selectedFilters.subject ? 3 : 0)
    .attr("d", d => arc(d.current));

  // Tooltip
  path.on("mouseover", function(event, d) {
    d3.select(this).attr("fill-opacity", 1);
    const tooltip = d3.select("body").append("div")
      .attr("class", "sunburst-tooltip")
      .style("position", "absolute")
      .style("background", "rgba(0,0,0,0.85)")
      .style("color", "#fff")
      .style("padding", "6px 12px")
      .style("border-radius", "4px")
      .style("pointer-events", "none")
      .style("font-size", "13px")
      .style("z-index", 1000)
      .html(`<strong>${d.data.name}</strong><br>Count: ${d3.format(",")(d.value)}`);
    tooltip.style("left", (event.pageX + 12) + "px")
      .style("top", (event.pageY - 24) + "px");
  })
    .on("mousemove", function(event) {
      d3.select(".sunburst-tooltip")
        .style("left", (event.pageX + 12) + "px")
        .style("top", (event.pageY - 24) + "px");
    })
    .on("mouseout", function() {
      d3.select(this).attr("fill-opacity", d => arcVisible(d.current) ? (d.children ? 0.7 : 0.45) : 0);
      d3.selectAll(".sunburst-tooltip").remove();
    });

  // Click to zoom (only if has children)
  path.filter(d => d.children)
    .style("cursor", "pointer")
    .on("click", function(event, d) {
      if (!d.children || d.children.length === 0) {
        // If no children, stay in the current view
        return;
      }
      clicked(event, d);
    });

  // Click on leaf to filter subject
  path.filter(d => !d.children)
    .style("cursor", "pointer")
    .on("click", function(event, d) {
      event.stopPropagation();
      // Toggle filter selection
      if (selectedFilters.subject === d.data.name) {
        selectedFilters.subject = null;
      } else {
        selectedFilters.subject = d.data.name;
      }
      showYearRangeStats(selectedFilters.startYear, selectedFilters.endYear, selectedLanguage);
      loadSamplesForLanguage(selectedLanguage).then(displayBooksSample);
      // Update stroke for filtering selection
      path.attr("stroke", d => d.data.name === selectedFilters.subject ? "#28a745" : "#fff")
        .attr("stroke-width", d => d.data.name === selectedFilters.subject ? 3 : 1);
    });

  // Title
  const format = d3.format(",d");
  path.append("title")
    .text(d => `${d.ancestors().map(d => d.data.name).reverse().join(" / ")}\n${format(d.value)}`);

  // Center circle for zoom out
  let currentNode = root;

  // Labels (only show for large topics, and clip to fit arc)
  const label = svg.append("g")
    .attr("pointer-events", "none")
    .attr("text-anchor", "middle")
    .style("user-select", "none")
    .selectAll("text")
    .data(root.descendants().slice(1))
    .join("text")
    .attr("dy", "0.35em")
    .attr("fill-opacity", d => labelVisible(d.current, d))
    .attr("transform", d => labelTransform(d.current))
    .text(d => {
      // Only show label if it's a large arc
      if (!labelVisible(d.current, d)) return "";
      // Only show names for nodes at the current visible depth (not for leaves when zoomed out)
      // Find the current root node (zoomed node)
      let visibleDepth = 1;
      if (typeof currentNode !== 'undefined' && currentNode.depth !== undefined) {
        visibleDepth = currentNode.depth + 1;
      }
      // Only show label if node is at the visible depth
      if (d.depth !== visibleDepth) return "";
      // Clip label to fit arc length
      let name = d.data.name;
      const arcLen = (d.current.x1 - d.current.x0) * ((d.current.y0 + d.current.y1) / 2 * radius);
      const maxChars = Math.floor(arcLen / 7); // ~7px per char
      if (name.length > maxChars && maxChars > 3) {
        name = name.slice(0, maxChars - 2) + "…";
      } else if (maxChars <= 3) {
        name = "";
      }
      return name;
    });

  const parent = svg.append("circle")
    .datum(root)
    .attr("r", 0.09 * radius)
    .attr("fill", "#fff")
    .attr("stroke", "#fff")
    .attr("stroke-width", 10)
    .attr("pointer-events", "all")
    .style("cursor", "pointer")
    .on("click", function(event) {
      if (currentNode.parent) {
        clicked(event, currentNode.parent);
      }
    });

  // Zoom handler
  function clicked(event, p) {
    // If the clicked node has no children, stay in the current view
    if (!p.children || p.children.length === 0) {
      return;
    }

    currentNode = p;
    parent.datum(p.parent || root);

    root.each(d => d.target = {
      x0: Math.max(0, Math.min(1, (d.x0 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
      x1: Math.max(0, Math.min(1, (d.x1 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
      y0: Math.max(0, d.y0 - p.depth),
      y1: Math.max(0, d.y1 - p.depth)
    });

    const t = svg.transition().duration(event && event.altKey ? 7500 : 750);

    path.transition(t)
      .tween("data", d => {
        const i = d3.interpolate(d.current, d.target);
        return t => d.current = i(t);
      })
      .filter(function(d) {
        return +this.getAttribute("fill-opacity") || arcVisible(d.target);
      })
      .attr("fill-opacity", d => arcVisible(d.target) ? (d.children ? 0.7 : 0.45) : 0)
      .attr("pointer-events", d => arcVisible(d.target) ? "auto" : "none")
      .attrTween("d", d => () => arc(d.current));

    label.filter(function(d) {
      return +this.getAttribute("fill-opacity") || labelVisible(d.target, d);
    }).transition(t)
      .attr("fill-opacity", d => labelVisible(d.target, d))
      .attrTween("transform", d => () => labelTransform(d.current))
      .text(function(d) {
        if (!labelVisible(d.target, d)) return "";
        const arcLen = (d.target.x1 - d.target.x0) * ((d.target.y0 + d.target.y1) / 2 * radius);
        const maxChars = Math.floor(arcLen / 7);
        let name = d.data.name;
        if (name.length > maxChars && maxChars > 3) {
          name = name.slice(0, maxChars - 2) + "…";
        } else if (maxChars <= 3) {
          name = "";
        }
        return name;
      });

    // Update breadcrumb
    updateBreadcrumb(p);
  }

  // Only show labels for large topics/arcs
  function labelVisible(d, node) {
    // Only show if arc is large enough (angle and radius)
    const minAngle = 0.15; // radians, about 10 degrees
    const minArcLen = 50; // pixels
    const angle = d.x1 - d.x0;
    const avgRadius = ((d.y0 + d.y1) / 2) * radius;
    const arcLen = angle * avgRadius;
    return d.y1 <= 3 && d.y0 >= 1 && angle > minAngle && arcLen > minArcLen;
  }

  function arcVisible(d) {
    return d.y1 <= 3 && d.y0 >= 1 && d.x1 > d.x0;
  }

  function labelTransform(d) {
    const x = (d.x0 + d.x1) / 2 * 180 / Math.PI;
    const y = (d.y0 + d.y1) / 2 * radius;
    return `rotate(${x - 90}) translate(${y},0) rotate(${x < 180 ? 0 : 180})`;
  }

  function updateBreadcrumb(d) {
    const ancestors = d.ancestors().reverse().slice(1);
    if (ancestors.length === 0) {
      breadcrumb.html("");
    } else {
      breadcrumb.html(ancestors.map((d, i) => {
        const percent = totalCount > 0 ? (d.value / totalCount * 100).toFixed(1) : 0;
        return `<span class="breadcrumb-item" onclick="sunburstBreadcrumbClick(event, '${d.data.name}', ${d.value})">${d.data.name}</span> (${d3.format(",")(d.value)}, ${percent}%)`;
      }).join(" > "));
    }
  }

  // Expose function for breadcrumb click
  window.sunburstBreadcrumbClick = function(event, name, value) {
    event.stopPropagation();
    // Find the node by name and value
    let targetNode = root.descendants().find(d => d.data.name === name && d.value === value);
    if (targetNode) {
      // Only zoom if the node has children
      if (targetNode.children && targetNode.children.length > 0) {
        clicked(event, targetNode);
        // Clear subject filter if zooming to a higher level
        if (targetNode !== root && targetNode.children) {
          selectedFilters.subject = null;
          showYearRangeStats(selectedFilters.startYear, selectedFilters.endYear, selectedLanguage);
          loadSamplesForLanguage(selectedLanguage).then(displayBooksSample);
          path.attr("stroke", d => d.data.name === selectedFilters.subject ? "#28a745" : "#fff")
            .attr("stroke-width", d => d.data.name === selectedFilters.subject ? 3 : 1);
        }
      }
    }
  };

  // Initial breadcrumb rendering
  updateBreadcrumb(root);
 }
  // --- MODIFIED showYearRangeStats FUNCTION (Title/Subtitle update) ---
  function showYearRangeStats(startYear, endYear, selectedLanguage) { 
    const statsDiv = d3.select("#selection-info");
    statsDiv.html('');

    const filteredData = timeSeriesData.series.find(d => d.language === selectedLanguage);

    if (!filteredData) {
    document.getElementById('language-name').textContent = selectedLanguage ? `Statistics for ${selectedLanguage}` : 'Language Popularity Over Time';
    document.getElementById('stats-subtitle').textContent = `Total Publications: N/A`;
    return;
    }

    const selectedValues = filteredData.values.filter(d => d.year >= startYear && d.year <= endYear);
    const totalCount = d3.sum(selectedValues, d => d.count);
    const formattedTotal = d3.format(",")(totalCount);
    
    // CHANGE 9: Update H1 and Subtitle with the requested statistics format
    const yearRangeDisplay = `${startYear}${startYear !== endYear ? ' - ' + endYear : ''}`;
    
    document.getElementById('language-name').textContent = 
        `Statistics for ${selectedLanguage}: ${yearRangeDisplay}`;
    document.getElementById('stats-subtitle').textContent = 
        `Total Publications: ${formattedTotal}`;


    const currentTypeFilter = selectedFilters.type;
    const currentSubjectFilter = selectedFilters.subject;
      
    let finalTypeCounts = new Map();
    let finalSubjectCounts = null;

    selectedValues.forEach(d => {
      const yearTypeCounts = d.type || {};
      const yearSubjectCounts = d.subject || {};

      // 1. Calculate Type Counts (Filter by selected Subject)
      if (currentSubjectFilter) {
        let subjectExists = Object.keys(yearSubjectCounts).some(subject => subject === currentSubjectFilter);
        if (subjectExists) {
          Object.entries(yearTypeCounts).forEach(([type, count]) => {
            if (type && count > 0) {
              finalTypeCounts.set(type, (finalTypeCounts.get(type) || 0) + count);
            }
          });
        }
      } else {
        Object.entries(yearTypeCounts).forEach(([type, count]) => {
          if (type && count > 0) {
            finalTypeCounts.set(type, (finalTypeCounts.get(type) || 0) + count);
          }
        });
      }
    });

    // For the sunburst, build a nested hierarchy for the selected year range
    function buildNestedHierarchy(selectedValues) {
      // Helper to merge subject counts into the hierarchy
      function mergeCounts(ref, counts) {
        if (!ref || typeof ref !== 'object') return null;
        let node = {};
        for (const key in ref) {
          if (ref[key] && typeof ref[key] === 'object' && Array.isArray(ref[key].subjects)) {
            // Leaf node: sum counts for this subject
            let mergedSubjects = ref[key].subjects.map(s => {
              let total = 0;
              for (const year of counts) {
                if (year.subject && year.subject[s.name]) {
                  total += year.subject[s.name];
                }
              }
              return { name: s.name, value: total };
            }).filter(s => s.value > 0);
            if (mergedSubjects.length > 0) {
              node[key] = {
                ...ref[key],
                subjects: mergedSubjects
              };
            }
          } else if (typeof ref[key] === 'object') {
            // Nested node
            const child = mergeCounts(ref[key], counts);
            if (child && Object.keys(child).length > 0) {
              node[key] = child;
            }
          }
        }
        return node;
      }
      return mergeCounts(subjectTopicReference, selectedValues);
    }
    if (!currentTypeFilter) {
      finalSubjectCounts = buildNestedHierarchy(selectedValues);
    } else {
      // If a type filter is applied, keep the old logic (flat counts)
      finalSubjectCounts = new Map();
      selectedValues.forEach(d => {
        const yearTypeCounts = d.type || {};
        const yearSubjectCounts = d.subject || {};
        let typeExists = Object.keys(yearTypeCounts).some(type => type === currentTypeFilter);
        if (typeExists) {
          Object.entries(yearSubjectCounts).forEach(([subject, count]) => {
            if (subject && count > 0) {
              finalSubjectCounts.set(subject, (finalSubjectCounts.get(subject) || 0) + count);
            }
          });
        }
      });
    }

    lastTypeCounts = finalTypeCounts;
    const totalTreemapCount = d3.sum(Array.from(finalTypeCounts.values()));
    let totalSunburstCount = 0;
    if (!currentTypeFilter && subjectTopicReference) {
      // Try to sum all leaf subject values in the hierarchy
      function sumSubjects(obj) {
        if (obj && typeof obj === 'object' && Array.isArray(obj.subjects)) {
          return obj.subjects.reduce((acc, s) => acc + (s.value || 0), 0);
        } else if (obj && typeof obj === 'object') {
          return Object.values(obj).reduce((acc, v) => acc + sumSubjects(v), 0);
        }
        return 0;
      }
      totalSunburstCount = sumSubjects(subjectTopicReference);
    } else if (finalSubjectCounts instanceof Map) {
      totalSunburstCount = d3.sum(Array.from(finalSubjectCounts.values()));
    }
    lastTotalCount = totalTreemapCount;

    createTreemap(finalTypeCounts, currentSubjectFilter ? totalTreemapCount : totalCount);
    createSunburst(finalSubjectCounts, currentTypeFilter ? totalSunburstCount : totalCount);
  }

    document.getElementById('reset-button').addEventListener('click', () => {
      d3.select('.brush').call(d3.brushX().clear);
      const years = timeSeriesData.years;
      selectedFilters.startYear = d3.min(years);
      selectedFilters.endYear = d3.max(years);
      selectedFilters.type = null;
      selectedFilters.subject = null;
      showYearRangeStats(d3.min(years), d3.max(years), selectedLanguage);
      loadSamplesForLanguage(selectedLanguage).then(displayBooksSample);
      document.getElementById('reset-button').style.display = 'none';
    });

  </script>
